name: Release build

on:
  workflow_dispatch

jobs:
  build:
    name: Release build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
          - platform: 3
            platform_name: tvos
          - platform: 7
            platform_name: iossimulator
          - platform: 8
            platform_name: tvossimulator
    
    runs-on: MacStadium
    steps:
      - name: Remove work folders
        env:
          password: ${{ secrets.ELLIE_MINI_SECRET }}
        run: |
          echo "before"
          ls -lah ./
          echo $password | sudo -S rm -rf ./* || true
          echo $password | sudo -S rm -rf ./.??* || true
          echo "after"
          ls -lah ./
          
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo "::set-output name=sha::$(echo $(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*'))"
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@main
        if: false # use gl4es 1.1.5
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        uses: actions/checkout@v4
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es 1.1.6
        run: |
          cd gl4es
          if [ -f ../patches/gl4es-v1.1.6-amethyst.patch ]; then
            git apply --binary --whitespace=nowarn ../patches/gl4es-v1.1.6-amethyst.patch
            echo "Applied GL4ES v1.1.6 patch successfully."
          fi
          sed -i '' 's/-framework MetalANGLE/-framework libEGL -framework libGLESv2/g' src/CMakeLists.txt
          sed -i '' 's|"-F../../external"|"-F../../external"\n            "-F${CMAKE_SOURCE_DIR}/../Natives/resources/Frameworks"|g' src/CMakeLists.txt
          if [ -f ../patches/ios.toolchain.cmake ]; then
            cp -f ../patches/ios.toolchain.cmake ./ios.toolchain.cmake
          else
            curl -fsSL -o ios.toolchain.cmake https://raw.githubusercontent.com/leetal/ios-cmake/master/ios.toolchain.cmake
          fi
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration -fvisibility=default"
          cmake --build build --config RelWithDebInfo --target GL -j$(sysctl -n hw.ncpu)
          BUILT_LIB=$(find . -name "libGL.dylib" | head -n 1)
          if otool -L "$BUILT_LIB" | grep -q "MetalANGLE"; then
            install_name_tool -change @rpath/MetalANGLE.framework/MetalANGLE @rpath/libGLESv2.framework/libGLESv2 "$BUILT_LIB" || true
          fi
          echo "=== libGL.dylib dependencies ==="
          otool -L "$BUILT_LIB"
          cp -f "$BUILT_LIB" ../Natives/resources/Frameworks/libgl4es_116.dylib
          ls -lah ../Natives/resources/Frameworks/libgl4es_116.dylib
          
      - name: Get JRE8
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-ios-aarch64

      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-ios-aarch64

      - name: Get JRE21
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-ios-aarch64

      - name: Build for ${{ matrix.platform_name }}
        env:
          password: ${{ secrets.ELLIE_MINI_SECRET }}
        run: |
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:$PATH
          export RUNNER=1
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            # Build ipa and tipa for iOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            # Build tipa only for tvOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1
          else
            # Build ipa only for everything else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@main
        with:
          name: net.kdt.pojavlauncher-${{ matrix.platform_name }}.ipa
          path: artifacts/net.kdt.pojavlauncher-*-${{ matrix.platform_name }}.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@main
        with:
          name: net.kdt.pojavlauncher-${{ matrix.platform_name }}.tipa
          path: artifacts/net.kdt.pojavlauncher-*-${{ matrix.platform_name }}-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        uses: actions/upload-artifact@main
        if: matrix.platform_name == 'ios'
        with:
          name: PojavLauncher.dSYM
          path: artifacts/PojavLauncher.dSYM
